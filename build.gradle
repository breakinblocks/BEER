plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        name = "Jared's Maven"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven {
        name = "Shadows"
        url = "https://maven.shadowsoffire.dev/releases"
        content {
            includeGroup "dev.shadowsoffire"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            programArguments.addAll '--username', 'TheonlyTazz', '--world', '"New World"'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    compileOnly("mezz.jei:jei-${jei_mc_version}-neoforge-api:${jeiVersion}")
    runtimeOnly("mezz.jei:jei-${jei_mc_version}-neoforge:${jeiVersion}")

    implementation("curse.maven:jade-324717:${jadeVersion}")

    compileOnly("dev.shadowsoffire:ApothicEnchanting:${apothicenchantVersion}")
    runtimeOnly("dev.shadowsoffire:Placebo:${placeboVersion}")
    runtimeOnly("dev.shadowsoffire:ApothicAttributes:${attributeslibVersion}")
    runtimeOnly("dev.shadowsoffire:ApothicEnchanting:${apothicenchantVersion}")
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Mod publishing to CurseForge (GitHub releases handled by CI)
publishMods {
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = STABLE
    modLoaders.add("neoforge")

    curseforge {
        projectId = "1274736"
        projectSlug = "bookshelf-extended-enchanting-reach"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        optional("jei", "jade", "apothic-enchanting")
    }
}

// Include Maven publish when running publishMods
tasks.named('publishMods') {
    def mavenUser = providers.environmentVariable("MAVEN_USER")
    if (mavenUser.isPresent()) {
        dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
    }
}
